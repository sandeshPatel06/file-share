name = "file-share"
compatibility_date = "2024-03-20"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = ".vercel/output/static"

[[d1_databases]]
binding = "DB"
database_name = "file-share-db"
database_id = "your-d1-id" # You'll need to update this after creating the D1 database

[[r2_buckets]]
binding = "UPLOADS_BUCKET"
bucket_name = "file-share-uploads" # You'll need to create this R2 bucket in your Cloudflare dashboard
